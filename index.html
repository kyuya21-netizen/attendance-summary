.bar input{flex:1;min-width:0;width:100%;height:44px;border:1px solid var(--line);border-radius:14px;padding:0 14px;background:var(--surface);color:var(--ink);font:inherit;box-shadow:var(--shadow)}
.bar button{white-space:nowrap;height:44px;border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);padding:0 14px;font:inherit;box-shadow:var(--shadow);cursor:pointer}
.cxl b,.cxl .kd{text-decoration:line-through;opacity:.55}.cxl .em{opacity:.5}.cxn.pn{color:#B7791F}.cxn{font-size:10.5px;color:#B3402A;font-style:normal;font-weight:700}

.fn{cursor:pointer;text-decoration:underline dotted;text-underline-offset:3px}tr.lg td{text-align:left!important;white-space:normal;background:var(--head)!important;font-size:13px}tr.lg td.fx{font-size:15px;line-height:1.6}

.hl{display:block;margin:0 0 8px;padding:7px 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--gold);font-size:13px;font-weight:700;text-align:center;text-decoration:none}.libb{display:flex;align-items:center;gap:12px;margin:-16px -14px 12px;padding:12px 16px;border-radius:17px 17px 0 0;color:var(--chalk);background:radial-gradient(90% 120% at 100% 0,rgba(232,118,43,.35),rgba(232,118,43,0) 55%),linear-gradient(150deg,var(--navy2),var(--navy))}.libb>span{font-size:30px}.libb b{display:block;font:700 22px/1.2 var(--serif);color:#fff}.libb small{display:block;margin-top:4px;font-size:13px;opacity:.85}

function parseCSV(t){const rows=[];let r=[],f='',q=false;
  for(let i=0;i<t.length;i++){const c=t[i];
    if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
    else if(c==='"')q=true;
    else if(c===','){r.push(f);f=''}
    else if(c==='\n'){r.push(f);rows.push(r);r=[];f=''}
    else if(c!=='\r')f+=c}
  if(f!==''||r.length){r.push(f);rows.push(r)}
  const n=Math.max(...rows.map(x=>x.length));return rows.map(x=>Array.from({length:n},(_,i)=>x[i]||''))}
async function loadCsv(name){

  if(!r.ok)throw new Error('HTTP '+r.status);
  const t=await r.text();if(/^\s*<!doctype html|^\s*<html/i.test(t))throw new Error('not csv');
  return parseCSV(t)}
async function loadJson(name){

  const r=await fetch(url,{cache:'no-store'});
  if(!r.ok)throw new Error('HTTP '+r.status);
  const t=await r.text();
  const j=JSON.parse(t.slice(t.indexOf('(')+1,t.lastIndexOf(')')));
  if(j.status==='error')throw new Error('sheet error');
  const n=j.table.cols.length;
  return j.table.rows.map(row=>{const c=row.c||[];return Array.from({length:n},(_,i)=>{const x=c[i];if(!x||x.v==null)return'';return x.f!=null?String(x.f):String(x.v)})});
}

const num=x=>+String(x==null?'':x).replace(/[^\d.-]/g,'')||0,W=n=>(n<0?'-':'')+Math.abs(n).toLocaleString('ko-KR');
const LF=s=>String(s).replace(/^생명선 (\d+명)/,'생명선(현금납부 인원) $1');

  const R=rows.slice(3).map(r=>r.map(x=>x.trim())).filter(c=>c[0]);

  const BB=ML.map(o=>({m:o.m,b:Object.entries(o.p.xs).filter(([n])=>n.includes('본부')).reduce((t,[,v])=>t+v,0),l:o.l.x})).filter(x=>x.b||x.l);
  if(BB.length&&!q){const tb=BB.reduce((t,x)=>t+x.b,0),tl=BB.reduce((t,x)=>t+x.l,0);
    html+='<div class="mc"><b>본부 송금 기록</b><p class="sub" style="margin:2px 0 4px">달마다 본부로 보낸 돈이에요.</p>'+BB.map(x=>'<p class="n"><b>'+x.m.replace("-",".")+'</b> 본부후원금 '+W(x.b)+'원 · 생명선 '+W(x.l)+'원</p>').join('')+'<p class="n" style="margin-top:8px"><b>합계</b> 본부후원금 '+W(tb)+'원 · 생명선 '+W(tl)+'원</p></div>'}
  const cards=R.filter(c=>[2,3,4,5,6,7,8,9].some(i=>num(c[i])!==0)).filter(c=>!YEAR||c[1].startsWith(YEAR)).map(c=>{
    const its=(items||[]).slice(3).map(r=>r.map(x=>x.trim())).filter(r=>r[0]&&r[0]===c[0]);

function nextJoint(){const t=new Date(),t0=new Date(t.getFullYear(),t.getMonth(),t.getDate());let y=t.getFullYear(),m=t.getMonth();
  for(let i=0;i<30;i++,m++){if((m%12+1)%2===0)continue;const e=new Date(y+Math.floor(m/12),m%12+1,0);while(e.getDay()!==4)e.setDate(e.getDate()-1);if(e>=t0)return{d:e,k:Math.round((e-t0)/864e5)}}return null}
let CM=0,SF=null;
function setSF(c){const m=(c[0]||'').match(/(\d{4})\.(\d{1,2})\.(\d{1,2})/);SF=m?{y:+m[1],m:+m[2]-1,d:+m[3],dd:c[1]||'',raw:c[0]}:null}
function sfN(){const R=DATA['요약']||[],i=R.findIndex(r=>/^다음 잔치/.test((r[0]||'').trim()));if(i<0)return 0;let n=0;for(let k=i+3;k<R.length;k++){if(!(R[k][0]||'').trim())break;n++}return n}
function thu3(y,m){let c=0;for(let d=1;d<=31;d++){const x=new Date(y,m,d);if(x.getMonth()!==m)break;if(x.getDay()===4&&++c===3)return x}}
function feastBase(y,m){const out=[];
  for(const r of mainRos()){const a=((r[2]||'')+'').match(/(\d{4})\.(\d{1,2})\.(\d{1,2})/),n=(r[0]||'').trim();if(!a||!n)continue;const ay=+a[1],am=+a[2]-1,ad=+a[3],lg=a[0];

    const h=new Date(ay,am,ad+100),t3=thu3(h.getFullYear(),h.getMonth()),tm=h<=t3?new Date(h.getFullYear(),h.getMonth(),1):new Date(h.getFullYear(),h.getMonth()+1,1);

  const cx=cxSet(),ym=y+'.'+String(m+1).padStart(2,'0');return out.map(x=>{x.cx=cx.has(x.n+'|'+x.k+'|'+ym);return x})}
function feastList(y,m){const pp=ppSet(),ym=(a,b)=>a+'.'+String(b+1).padStart(2,'0'),out=feastBase(y,m);out.forEach(x=>{x.pp=pp.has(x.n+'|'+x.k+'|'+ym(y,m))});
  const py=m?y:y-1,pm=(m+11)%12;feastBase(py,pm).forEach(x=>{if(pp.has(x.n+'|'+x.k+'|'+ym(py,pm)))out.push(Object.assign({},x,{cr:1,pp:false,cx:false}))});return out}

function calInner(){
