<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>수원매산GA 회합 출석 요약</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1C2541">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="매산GA회합"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F1F3F9;--surface:#fff;--ink:#16203B;--muted:#5D6785;--line:#E2E6F0;--navy:#1C2541;--navy2:#2B3A6B;--chalk:#F3F5FA;--head:#EEF1F8;--gold:#8A5A00;--gold2:#C9962F;--ok:#0B7A5A;--shadow:0 1px 2px rgba(28,37,65,.05),0 10px 26px -14px rgba(28,37,65,.18);--serif:'Noto Serif KR','Nanum Myeongjo',serif}
@media(prefers-color-scheme:dark){:root{--bg:#0B1120;--surface:#141C33;--ink:#E7EBF7;--muted:#97A1C0;--line:#222C4D;--navy:#18214A;--navy2:#2A3A80;--head:#1B2543;--gold:#E8B84F;--gold2:#E8B84F;--ok:#4BD1A5;--shadow:0 1px 2px rgba(0,0,0,.3),0 10px 26px -14px rgba(0,0,0,.6)}}
*{box-sizing:border-box}
html,body{overflow-x:hidden}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 'Noto Sans KR',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;padding-bottom:84px;-webkit-font-smoothing:antialiased}
header{position:relative;color:var(--chalk);padding:22px 18px 26px;background:radial-gradient(120% 140% at 100% 0,rgba(201,150,47,.28) 0,rgba(201,150,47,0) 46%),linear-gradient(160deg,var(--navy2) 0,var(--navy) 62%);border-radius:0 0 26px 26px;box-shadow:0 12px 30px -18px rgba(28,37,65,.6)}
header .eb{margin:0 0 6px;font-size:11px;font-weight:700;letter-spacing:.18em;color:var(--gold2);opacity:1}
header h1{margin:0;font:700 24px/1.3 var(--serif);padding-right:96px;letter-spacing:-.01em;word-break:keep-all}
header p{margin:10px 0 0;font-size:12px;opacity:.82}
header #upd{display:inline-block;padding:3px 10px;border-radius:999px;background:rgba(255,255,255,.12)}
#zm{position:absolute;right:14px;top:16px;display:flex;gap:6px}
#zm button{min-width:38px;height:32px;border:1px solid rgba(243,245,250,.45);border-radius:999px;background:rgba(255,255,255,.08);color:var(--chalk);font-size:13px;font-weight:700;padding:0 8px;cursor:pointer}
#zm button:disabled{opacity:.35}
main{max-width:720px;margin:0 auto;padding:16px 14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px 14px;margin-bottom:14px;overflow-x:auto;box-shadow:var(--shadow)}
h2{margin:0 0 10px;font:700 16px/1.3 var(--serif);display:flex;align-items:center;gap:8px}
h2::before{content:"";width:4px;height:16px;border-radius:2px;background:linear-gradient(var(--gold2),var(--gold))}
.sub{color:var(--muted);font-size:13px;margin:0 0 6px}
table{border-collapse:separate;border-spacing:0;width:100%;font-variant-numeric:tabular-nums;font-size:13.5px;white-space:nowrap}
th,td{padding:9px 8px;border-top:1px solid var(--line);text-align:center}
th{background:var(--head);font-size:12px;font-weight:700;border-top:0;color:var(--muted)}
th:first-child{border-radius:10px 0 0 10px}th:last-child{border-radius:0 10px 10px 0}
tbody tr:nth-child(even) td{background:color-mix(in srgb,var(--head) 38%,transparent)}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--surface)}
tbody tr:nth-child(even) td:first-child{background:color-mix(in srgb,var(--head) 38%,var(--surface))}
th:first-child{background:var(--head)}
tr.tot td{font-weight:700;background:var(--head)!important;border-top:2px solid var(--line)}
.hero{margin:-16px -14px 12px;padding:16px 16px 16px;border-radius:17px 17px 0 0;color:var(--chalk);background:radial-gradient(90% 120% at 100% 0,rgba(201,150,47,.35),rgba(201,150,47,0) 55%),linear-gradient(150deg,var(--navy2),var(--navy))}
.hero h2{color:var(--chalk);margin-bottom:6px;font-size:13px;letter-spacing:.1em;opacity:.9}.hero h2::before{background:var(--gold2)}
.hero .big{font:700 26px/1.25 var(--serif);color:#fff}
.hero .dd{display:inline-block;margin:8px 0 0;padding:2px 12px;border-radius:999px;background:var(--gold2);color:#1C2541;font-weight:700;font-size:13px}
.big{font:700 22px/1.3 var(--serif);margin:0}.dd{margin:0 0 8px;color:var(--muted);font-size:14px}
.mc{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--gold2);border-radius:16px;padding:13px 14px;margin-bottom:10px;box-shadow:var(--shadow)}
.mc b{font-weight:700}.mc>b:first-of-type{font:700 17px var(--serif)}.mc .c{float:right;color:var(--muted);font-size:12px;background:var(--head);border-radius:999px;padding:2px 10px;margin-top:2px}
.mc .n{margin:7px 0 0;font-size:13px;line-height:1.6;word-break:keep-all}
.mc .n i{font-style:normal;font-weight:700;font-size:11px;color:var(--muted);background:var(--head);border-radius:6px;padding:1px 7px;margin-right:7px}
.pr{padding:11px 0;border-top:1px solid var(--line)}.pr:first-child{border-top:0}.pr b{font-size:15px}.pr .c{float:right;font-weight:700;color:var(--gold)}.pr .n{margin:3px 0 0;font-size:13px;color:var(--muted)}
.tag{display:inline-block;font-size:11.5px;font-weight:700;border:1px solid var(--gold);color:var(--gold);border-radius:999px;padding:0 9px;margin-left:6px;vertical-align:middle}
.tag.nw{border-color:var(--ok);color:var(--ok)}
nav{position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:2px;padding:6px;background:color-mix(in srgb,var(--surface) 88%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:22px;box-shadow:0 12px 30px -10px rgba(28,37,65,.35);max-width:700px;margin:0 auto}
nav button{flex:1;height:44px;border:0;border-radius:16px;background:none;color:var(--muted);font:500 13px 'Noto Sans KR',sans-serif;white-space:nowrap;padding:0 2px;cursor:pointer}
nav button.on{background:var(--navy);color:#fff;font-weight:700}
@media(prefers-color-scheme:dark){nav button.on{background:var(--navy2)}}
.bar{display:flex;gap:8px;margin-bottom:12px}
.bar input{flex:1;min-width:0;width:100%;height:44px;border:1px solid var(--line);border-radius:14px;padding:0 14px;background:var(--surface);color:var(--ink);font:inherit;box-shadow:var(--shadow)}
.bar button{white-space:nowrap;height:44px;border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);padding:0 14px;font:inherit;box-shadow:var(--shadow);cursor:pointer}
.yr[hidden]{display:none}.yr{display:flex;gap:8px;margin:0 0 12px;overflow-x:auto;scrollbar-width:none}.yr::-webkit-scrollbar{display:none}.yr button{white-space:nowrap;height:36px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--ink);padding:0 16px;font:inherit;font-size:14px;cursor:pointer}.yr button.on{background:var(--navy);border-color:var(--navy);color:#fff;font-weight:700}
@media(prefers-color-scheme:dark){.yr button.on{background:var(--navy2);border-color:var(--navy2)}}
.fn{cursor:pointer;text-decoration:underline dotted;text-underline-offset:3px}tr.lg td{text-align:left!important;white-space:normal;background:var(--head)!important;font-size:13px}
.msg{text-align:center;color:var(--muted);padding:34px 8px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 14px 12px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.tile::after{content:"";position:absolute;right:-18px;top:-18px;width:64px;height:64px;border-radius:50%;background:radial-gradient(var(--gold2),transparent 70%);opacity:.22}
.tile span{display:block;font-size:12px;font-weight:700;color:var(--muted)}
.tile strong{display:block;font:700 22px/1.3 var(--serif);margin:2px 0;font-variant-numeric:tabular-nums}
.tile small{color:var(--muted);font-size:11.5px}
.rk{display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:24px;border-radius:50%;font-weight:700;font-size:12px}
.rk.r1{background:#E8B84F;color:#3A2700}.rk.r2{background:#C9CFDB;color:#25304D}.rk.r3{background:#D9A37A;color:#3B2110}
td.pc{position:relative;font-weight:700}
#a2{display:none;margin:0 0 12px;padding:12px 14px;border-radius:16px;background:var(--surface);border:1px solid var(--gold2);box-shadow:var(--shadow);font-size:13.5px;line-height:1.55}
#a2 b{font-family:var(--serif)}#a2 .r{display:flex;gap:8px;margin-top:8px}
#a2 button{height:34px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:0 14px;font:inherit;font-size:13px;cursor:pointer}#a2 button.go{background:var(--navy);border-color:var(--navy);color:#fff;font-weight:700}
@media print{nav,#zm,#a2{display:none}}
</style>
</head>
<body>
<header><div id="zm"><button id="zo" aria-label="글씨 작게">가-</button><button id="zi" aria-label="글씨 크게">가+</button></div><h1>수원매산GA<br>회합 출석 요약</h1><p><span id="upd">불러오는 중…</span></p></header>
<main><div id="a2"></div><div class="bar"><input id="q" type="search" placeholder="검색 (이름, 날짜, 회차)" autocomplete="off"><button id="rf">새로고침</button></div><div class="yr" id="yr" hidden></div><div id="view"><p class="msg">불러오는 중…</p></div></main>
<nav id="nav"></nav>
<script>
const SHEET_ID='1_IlzlQDYUgUECpNJhSMEJLBqXalOOwguums1W0lP3rs';
const TABS=['요약','주모임 명단','월간 보고','회계','연도별','회합별'];
const DATA={};let CUR=TABS[0];
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const GID={'요약':7001,'연도별':7002,'회합별':7003,'주모임 명단':7004,'월간 보고':7005,'회계':7006,'회계 내역':7007};
function parseCSV(t){const rows=[];let r=[],f='',q=false;
  for(let i=0;i<t.length;i++){const c=t[i];
    if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
    else if(c==='"')q=true;
    else if(c===','){r.push(f);f=''}
    else if(c==='\n'){r.push(f);rows.push(r);r=[];f=''}
    else if(c!=='\r')f+=c}
  if(f!==''||r.length){r.push(f);rows.push(r)}
  const n=Math.max(...rows.map(x=>x.length));return rows.map(x=>Array.from({length:n},(_,i)=>x[i]||''))}
async function loadCsv(name){
  const r=await fetch('https://docs.google.com/spreadsheets/d/'+SHEET_ID+'/export?format=csv&gid='+GID[name]+'&_='+Date.now(),{cache:'no-store'});
  if(!r.ok)throw new Error('HTTP '+r.status);
  const t=await r.text();if(/^\s*<!doctype html|^\s*<html/i.test(t))throw new Error('not csv');
  return parseCSV(t)}
async function loadJson(name){
  const url='https://docs.google.com/spreadsheets/d/'+SHEET_ID+'/gviz/tq?tqx=out:json&headers=0&sheet='+encodeURIComponent(name)+'&_='+Date.now();
  const r=await fetch(url,{cache:'no-store'});
  if(!r.ok)throw new Error('HTTP '+r.status);
  const t=await r.text();
  const j=JSON.parse(t.slice(t.indexOf('(')+1,t.lastIndexOf(')')));
  if(j.status==='error')throw new Error('sheet error');
  const n=j.table.cols.length;
  return j.table.rows.map(row=>{const c=row.c||[];return Array.from({length:n},(_,i)=>{const x=c[i];if(!x||x.v==null)return'';return x.f!=null?String(x.f):String(x.v)})});
}
async function load(name){try{return await loadCsv(name)}catch(e){return await loadJson(name)}}
const SHORT={'회합 횟수':'횟수','주모임 참석':'주','타모임 참석':'타','총 참석':'총','주모임 출석':'주'};
let YEAR='';
function meetCards(rows,q){
  const out=[];
  rows.slice(2).forEach(r=>{const c=r.map(x=>x.trim());if(!c[0])return;
    if(YEAR&&!c[1].startsWith(YEAR))return;const txt=c.join(' ');if(q&&!txt.replace(/\s+/g,'').includes(q))return;
    const f=(c[6]&&c[6]!=='0')?'<span class="tag">잔치 '+esc(c[6])+'</span>':'',nw=(c[5]&&c[5]!=='0')?'<span class="tag nw">신규 '+esc(c[5])+'</span>':'';
    out.push('<div class="mc"><span class="c">주 '+esc(c[2])+' · 타 '+esc(c[3])+' · 총 '+esc(c[4])+'</span><b>'+esc(c[0])+'회</b> <span class="sub" style="margin:0">'+esc(c[1])+'</span>'+nw+f
      +(c[7]?'<p class="n"><i>주모임</i>'+esc(c[7])+'</p>':'')+(c[8]?'<p class="n"><i>타모임</i>'+esc(c[8])+'</p>':'')+(c[9]?'<p class="n"><i>잔치</i>'+esc(c[9])+'</p>':'')+'</div>');});
  return out.join('')||'<p class="msg">검색 결과가 없어요.</p>';
}
const num=x=>+String(x==null?'':x).replace(/[^\d.-]/g,'')||0,W=n=>(n<0?'-':'')+Math.abs(n).toLocaleString('ko-KR');
function finCards(rows,items,q){
  const R=rows.slice(3).map(r=>r.map(x=>x.trim())).filter(c=>c[0]);
  const top=R[0];
  const item=(c)=>'<p class="n"><i>'+esc(c[3])+'</i>'+esc(c[4]||'(내용 없음)')+' <b>'+W(num(c[5]))+'원</b></p>';
  let html=top?'<div class="tiles">'+[['후원금',5],['생명선',9]].map(([l,i])=>'<div class="tile"><span>'+l+' 잔액</span><strong>'+W(num(top[i]))+'원</strong><small>'+esc(top[0])+'회 기준</small></div>').join('')+'</div>':'';
  const MO={};
  R.forEach(c=>{const m=c[1].slice(0,7).replace(/\./g,'-');if(YEAR&&!c[1].startsWith(YEAR))return;const o=MO[m]||(MO[m]={m,p:{i:0,x:0,e:null,xs:{}},l:{i:0,x:0,e:null,xs:{}}});
    [['p',3,4,5],['l',7,8,9]].forEach(([k,i,x,b])=>{o[k].i+=num(c[i]);o[k].x+=num(c[x]);if(o[k].e===null)o[k].e=num(c[b])})});
  (items||[]).slice(3).map(r=>r.map(x=>x.trim())).filter(r=>r[0]&&r[3]==='지출').forEach(r=>{const m=r[1].slice(0,7).replace(/\./g,'-'),o=MO[m];if(!o)return;const k=r[2]==='생명선'?'l':'p',n=r[4]||'(내용 없음)';o[k].xs[n]=(o[k].xs[n]||0)+num(r[5])});
  const ML=Object.values(MO).filter(o=>o.p.i||o.p.x||o.l.i||o.l.x).sort((a,b)=>a.m<b.m?1:-1);
  if(ML.length&&!q)html+='<div class="mc"><b>월별 결산</b>'+ML.map(o=>'<p class="n" style="margin-top:10px"><b>'+o.m.replace("-",".")+'</b></p>'+[['후원금','p'],['생명선','l']].map(([l,k])=>{const x=o[k];return '<p class="n"><b>'+l+'</b> 입금 '+W(x.i)+' · 지출 '+W(x.x)+' · 월말 잔액 <b>'+W(x.e)+'원</b></p>'+Object.entries(x.xs).sort((a,b)=>b[1]-a[1]).map(([n,v])=>'<p class="n" style="margin-left:10px">└ '+esc(n)+' '+W(v)+'원</p>').join('')}).join('')).join('')+'</div>';
  const cards=R.filter(c=>[2,3,4,5,6,7,8,9].some(i=>num(c[i])!==0)).filter(c=>!YEAR||c[1].startsWith(YEAR)).map(c=>{
    const its=(items||[]).slice(3).map(r=>r.map(x=>x.trim())).filter(r=>r[0]&&r[0]===c[0]);
    const txt=c.join(' ')+' '+its.map(r=>r.join(' ')).join(' ');
    if(q&&!txt.replace(/\s+/g,'').includes(q))return '';
    const blk=(l,o,ii,ie,ib)=>{const its2=its.filter(r=>r[2]===l);return '<p class="n" style="margin-top:10px"><b>'+l+'</b> 잔액 <b>'+W(num(c[ib]))+'원</b></p><p class="n">전주이월 '+W(num(c[o]))+' + 입금 '+W(num(c[ii]))+' − 지출 '+W(num(c[ie]))+'</p>'+its2.map(item).join('')};
    return '<div class="mc"><b>'+esc(c[0])+'회</b> <span class="sub" style="margin:0">'+esc(c[1])+'</span>'+blk('후원금',2,3,4,5)+blk('생명선',6,7,8,9)+'</div>'}).join('');
  return html+(cards||'<p class="msg">'+(q||YEAR?'검색 결과가 없어요.':'아직 입력된 회계 기록이 없어요.')+'</p>');
}
function render(){
  const rows=DATA[CUR]||[],q=$('#q').value.replace(/\s+/g,'');
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===CUR));
  const yb=$('#yr'),yrOn=CUR==='회합별'||CUR==='월간 보고'||CUR==='회계';yb.hidden=!yrOn;
  if(yrOn){yb.innerHTML=['','2026','2025','2024'].map(y=>'<button data-y="'+y+'"'+(y===YEAR?' class="on"':'')+'>'+(y?y+'년':'전체')+'</button>').join('')}
  if(CUR==='회계'){$('#view').innerHTML=finCards(rows,DATA['회계 내역'],q);return}
  if(CUR==='회합별'){$('#view').innerHTML=meetCards(rows,q);return}
  const upd=$('#upd').textContent;
  let html='',open=false,hdrNext=false,title=true,bigNext=false,person=false,pHead=[];
  const close=()=>{if(open){html+=person?'</div></section>':'</tbody></table></div></section>';open=false}};
  rows.forEach(r=>{
    const cells=r.map(x=>x.trim()),ne=cells.filter(Boolean);
    if(!ne.length){close();person=false;hdrNext=false;bigNext=false;return}
    if(ne.length===1&&cells[0]){
      if(title){title=false;return}
      if(cells[0]===upd){return}
      if(cells[0].length>22||/^최근 회합/.test(cells[0])){html+='<p class="sub">'+esc(cells[0])+'</p>';return}
      close();person=false;if(/^다음 잔치/.test(cells[0])){html+='<section class="panel"><div class="hero"><h2>'+esc(cells[0])+'</h2>';open=true;person=true;hdrNext=false;bigNext=true;return}html+='<section class="panel"><h2>'+esc(cells[0])+'</h2><div style="overflow-x:auto"><table><tbody>';open=true;hdrNext=true;bigNext=false;return}
    if(bigNext){html+='<p class="big">'+esc(cells[0])+'</p><p class="dd">'+esc(cells[1]||'')+'</p></div><div style="overflow-x:auto"><table><tbody>';bigNext=false;hdrNext=true;person=false;return}
    if(!open){html+='<section class="panel"><div style="overflow-x:auto"><table><tbody>';open=true;hdrNext=true}
    const isTot=cells[0]==='총계',hit=(!q||cells.join('').replace(/\s+/g,'').includes(q))&&!(CUR==='월간 보고'&&YEAR&&/^\d{4}\./.test(cells[0])&&!cells[0].startsWith(YEAR));
    if(hdrNext&&cells[0]==='이름'&&cells.length>=9){pHead=cells;person=true;html=html.replace(/<div style="overflow-x:auto"><table><tbody>$/,'<div>');hdrNext=false;return}
    if(person){if(!hit)return;const y=k=>(pHead[k]||'').split(' ')[0],v=(a,b)=>cells[a]?cells[a]+'회 '+(cells[b]||'-'):'-';
      html+='<div class="pr"><span class="c">누적 '+esc(cells[10]||'-')+'</span><b>'+esc(cells[0])+'</b> <span class="sub" style="margin:0">'+esc(cells[1])+'</span><p class="n">'+[2,4,6].map(k=>esc(y(k))+' '+(cells[k]?esc(cells[k])+'회 '+esc(cells[k+1]||'-'):'-')).join(' · ')+' · 누적 '+esc(cells[8]||'-')+'/'+esc(cells[9]||'-')+'</p></div>';return}
    if(hdrNext){html+='<tr>'+cells.map(c=>'<th>'+esc(SHORT[c]||c)+'</th>').join('')+'</tr>';hdrNext=false;return}
    if(!hit)return;
    html+='<tr'+(isTot?' class="tot"':'')+'>'+cells.map(c=>'<td>'+esc(c)+'</td>').join('')+'</tr>';
  });
  close();
  $('#view').innerHTML=html||'<p class="msg">내용이 없어요.</p>';
  document.querySelectorAll('#view table').forEach(t=>{const hh=[...t.querySelectorAll('th')].map(x=>x.textContent);if(hh[0]==='순위'){const pi=hh.indexOf('출석률');t.querySelectorAll('tr').forEach(tr=>{const td=tr.children;if(!td.length||td[0].tagName==='TH')return;const n=+td[0].textContent;if(n>=1&&n<=3)td[0].innerHTML='<span class="rk r'+n+'">'+n+'</span>';const c=td[pi];if(c){const v=parseInt(c.textContent);if(v>=0){c.classList.add('pc');c.style.background='linear-gradient(90deg,color-mix(in srgb,var(--gold2) 30%,transparent) '+v+'%,transparent '+v+'%)'}}})}});
  document.querySelectorAll('#view table').forEach(t=>{const h=[...t.querySelectorAll('th')].map(x=>x.textContent);if(h[0]==='이름'&&h[2]==='날짜')t.querySelectorAll('tr').forEach(tr=>{const d=tr.querySelector('td');if(d)d.classList.add('fn')})});
}
async function loadAll(){
  $('#view').innerHTML='<p class="msg">불러오는 중…</p>';
  try{
    for(const t of [...TABS,'회계 내역'])DATA[t]=await load(t);
    const sub=(DATA['요약']||[]).map(r=>r[0]).find(x=>/기준/.test(x));
    $('#upd').textContent=sub||'';
    render();
  }catch(e){
    $('#view').innerHTML='<p class="msg">데이터를 불러오지 못했어요.<br>스프레드시트가 "링크가 있는 모든 사용자 – 뷰어"로 공유돼 있는지 확인해 주세요.</p>';
    $('#upd').textContent='';
  }
}
const NL={'주모임 명단':'명단','월간 보고':'월간'};
$('#nav').innerHTML=TABS.map(t=>'<button data-t="'+t+'">'+(NL[t]||t)+'</button>').join('');
$('#nav').addEventListener('click',e=>{const b=e.target.closest('button');if(b){CUR=b.dataset.t;render();scrollTo(0,0)}});
$('#view').addEventListener('click',e=>{const td=e.target.closest('td.fn');if(!td)return;const tr=td.parentElement,nx=tr.nextElementSibling;if(nx&&nx.classList.contains('lg')){nx.remove();return}
  const nm=td.textContent.trim(),r=(DATA['주모임 명단']||[]).slice(3).find(x=>x[0].trim()===nm);
  const n=document.createElement('tr');n.className='lg';n.innerHTML='<td colspan="'+tr.children.length+'">'+esc(nm)+' · 마지막 도박일 <b>'+esc(r&&r[2].trim()?r[2].trim():'기록 없음')+'</b>'+(r&&r[1]?' · 최초참석 '+esc(r[1].trim()):'')+'</td>';tr.after(n)});
$('#q').addEventListener('input',render);
$('#yr').addEventListener('click',e=>{const b=e.target.closest('button');if(b){YEAR=b.dataset.y;render()}});
$('#rf').addEventListener('click',loadAll);
loadAll();

(function(){var L=[1,1.15,1.3,1.5],i=0;try{i=Math.max(0,Math.min(3,+localStorage.getItem('zoomLv')||0))}catch(e){}
function ap(){document.body.style.zoom=L[i]===1?'':L[i];try{localStorage.setItem('zoomLv',i)}catch(e){}document.getElementById('zo').disabled=i===0;document.getElementById('zi').disabled=i===3}
document.getElementById('zo').onclick=function(){if(i>0){i--;ap()}};document.getElementById('zi').onclick=function(){if(i<3){i++;ap()}};ap()})();

(function(){var box=document.getElementById('a2'),ua=navigator.userAgent,dp=null;
var inst=(window.matchMedia&&matchMedia('(display-mode: standalone)').matches)||navigator.standalone;
var hid=false;try{hid=localStorage.getItem('a2hs')==='1'}catch(e){}
if(inst||hid)return;
function show(h,btn){box.innerHTML=h+'<div class="r">'+(btn?'<button class="go" id="a2i">홈 화면에 추가</button>':'')+'<button id="a2x">다시 보지 않기</button></div>';box.style.display='block';
document.getElementById('a2x').onclick=function(){box.style.display='none';try{localStorage.setItem('a2hs','1')}catch(e){}};
var i=document.getElementById('a2i');if(i)i.onclick=function(){if(dp){dp.prompt();dp.userChoice.finally(function(){box.style.display='none'})}}}
var T='<b>홈 화면에 추가하면 앱처럼 바로 열려요</b><br>';
if(/KAKAOTALK|NAVER\(inapp|Line\//i.test(ua))show(T+'지금은 카카오톡 안에서 열려 있어요. 오른쪽 아래(또는 위) 메뉴에서 <b>다른 브라우저로 열기</b>를 누른 뒤 홈 화면에 추가해 주세요.');
else if(/iPhone|iPad|iPod/i.test(ua))show(T+'아래 <b>공유 버튼(□↑)</b>을 누르고 <b>홈 화면에 추가</b>를 선택하세요. 사파리에서만 돼요.');
else if(/Android/i.test(ua)){show(T+'오른쪽 위 <b>⋮ 메뉴</b> → <b>홈 화면에 추가</b>(또는 앱 설치)를 선택하세요.');window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();dp=e;show(T+'버튼을 누르면 바로 추가돼요.',true)})}
})();
</script>
