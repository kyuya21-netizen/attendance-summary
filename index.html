.libb{display:flex;align-items:center;gap:12px;margin:-16px -14px 14px;padding:16px;border-radius:17px 17px 0 0;color:var(--chalk);background:radial-gradient(90% 120% at 100% 0,rgba(201,150,47,.35),rgba(201,150,47,0) 55%),linear-gradient(150deg,var(--navy2),var(--navy))}.libb>span{font-size:30px}.libb b{display:block;font:700 22px/1.2 var(--serif);color:#fff}.libb small{display:block;margin-top:4px;font-size:13px;opacity:.85}

#sv{display:none;position:fixed;inset:0;z-index:100;flex-direction:column;background:var(--bg)}.svb{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 10px;background:var(--navy);color:#fff}.svb>b{flex:1;min-width:0;font:700 16px/1.25 var(--serif)}.svb>span{display:flex;gap:6px}.svb button{height:38px;min-width:54px;padding:0 12px;border:1px solid rgba(255,255,255,.45);border-radius:999px;background:rgba(255,255,255,.1);color:#fff;font:700 14px 'Noto Sans KR',sans-serif;cursor:pointer}
.svs{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;touch-action:pan-x pan-y pinch-zoom;background:var(--bg)}.svs img{display:block;max-width:none;height:auto}.svf{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--line)}.svf button{height:46px;min-width:104px;border:1px solid var(--line);border-radius:14px;background:var(--navy);color:#fff;font:700 16px 'Noto Sans KR',sans-serif;cursor:pointer}.svf button:disabled{opacity:.3}.svn{font:700 15px 'Noto Sans KR',sans-serif;color:var(--ink)}
.svt{position:absolute;left:0;right:0;top:calc(58px + env(safe-area-inset-top,0px));bottom:0;overflow:auto;background:var(--surface);padding:6px 14px 24px}.svt[hidden]{display:none}.svt>b{display:block;margin:8px 0;font:700 18px var(--serif)}.svt button{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;min-height:52px;padding:10px 4px;border:0;border-top:1px solid var(--line);background:none;color:var(--ink);text-align:left;font:500 16px 'Noto Sans KR',sans-serif;cursor:pointer}.svt button i{flex:none;font-style:normal;font-size:13px;color:var(--muted)}
.svh{margin:0;padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));font-size:13px;text-align:center;color:var(--muted);background:var(--surface);border-top:1px solid var(--line)}

td.pc{position:relative;font-weight:700}
#a2{display:none;margin:0 0 12px;padding:12px 14px;border-radius:16px;background:var(--surface);border:1px solid var(--gold2);box-shadow:var(--shadow);font-size:13.5px;line-height:1.55}
#a2 b{font-family:var(--serif)}#a2 .r{display:flex;gap:8px;margin-top:8px}

<header><div id="zm"><button id="zo" aria-label="글씨 작게">가-</button><button id="zi" aria-label="글씨 크게">가+</button></div><h1>수원매산 GA<br>출석시스템</h1><p><span id="upd">불러오는 중…</span></p></header>
<main><div id="a2"></div><div class="bar"><input id="q" type="search" placeholder="검색 (익명, 날짜, 회차)" autocomplete="off"><button id="rf">새로고침</button></div><div class="yr" id="yr" hidden></div><div id="view"><p class="msg">불러오는 중…</p></div></main>
<nav id="nav"></nav>
<script>
const SHEET_ID='1_IlzlQDYUgUECpNJhSMEJLBqXalOOwguums1W0lP3rs';
const TABS=['요약','주모임 명단','월간 보고','회계','연도별','회합별','비상연락망','자료실'];
const DATA={};let CUR=TABS[0];
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const GID={'요약':7001,'연도별':7002,'회합별':7003,'주모임 명단':7004,'월간 보고':7005,'회계':7006,'회계 내역':7007,'비상연락망':7008};
function parseCSV(t){const rows=[];let r=[],f='',q=false;
  for(let i=0;i<t.length;i++){const c=t[i];
    if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
    else if(c==='"')q=true;
    else if(c===','){r.push(f);f=''}
    else if(c==='\n'){r.push(f);rows.push(r);r=[];f=''}
    else if(c!=='\r')f+=c}
  if(f!==''||r.length){r.push(f);rows.push(r)}
  const n=Math.max(...rows.map(x=>x.length));return rows.map(x=>Array.from({length:n},(_,i)=>x[i]||''))}
async function loadCsv(name){
  const r=await fetch('https://docs.google.com/spreadsheets/d/'+SHEET_ID+'/export?format=csv&gid='+GID[name]+'&_='+Date.now(),{cache:'no-store'});
  if(!r.ok)throw new Error('HTTP '+r.status);
  const t=await r.text();if(/^\s*<!doctype html|^\s*<html/i.test(t))throw new Error('not csv');
  return parseCSV(t)}
async function loadJson(name){
  const url='https://docs.google.com/spreadsheets/d/'+SHEET_ID+'/gviz/tq?tqx=out:json&headers=0&sheet='+encodeURIComponent(name)+'&_='+Date.now();
  const r=await fetch(url,{cache:'no-store'});
  if(!r.ok)throw new Error('HTTP '+r.status);
  const t=await r.text();
  const j=JSON.parse(t.slice(t.indexOf('(')+1,t.lastIndexOf(')')));
  if(j.status==='error')throw new Error('sheet error');
  const n=j.table.cols.length;
  return j.table.rows.map(row=>{const c=row.c||[];return Array.from({length:n},(_,i)=>{const x=c[i];if(!x||x.v==null)return'';return x.f!=null?String(x.f):String(x.v)})});
}
async function load(name){try{return await loadCsv(name)}catch(e){return await loadJson(name)}}
const SHORT={'회합 횟수':'횟수','주모임 참석':'주','타모임 참석':'타','총 참석':'총','주모임 출석':'주'};
let YEAR='';
function meetCards(rows,q){
  const out=[];
  rows.slice(2).forEach(r=>{const c=r.map(x=>x.trim());if(!c[0])return;
    if(YEAR&&!c[1].startsWith(YEAR))return;const txt=c.join(' ');if(q&&!txt.replace(/\s+/g,'').includes(q))return;
    const f=(c[6]&&c[6]!=='0')?'<span class="tag">잔치 '+esc(c[6])+'</span>':'',nw=(c[5]&&c[5]!=='0')?'<span class="tag nw">신규 '+esc(c[5])+'</span>':'';
    out.push('<div class="mc"><span class="c">주 '+esc(c[2])+' · 타 '+esc(c[3])+' · 총 '+esc(c[4])+'</span><b>'+esc(c[0])+'회</b> <span class="sub" style="margin:0">'+esc(c[1])+'</span>'+nw+f
      +(c[7]?'<p class="n"><i>주모임</i>'+esc(c[7])+'</p>':'')+(c[8]?'<p class="n"><i>타모임</i>'+esc(c[8])+'</p>':'')+(c[9]?'<p class="n"><i>잔치</i>'+esc(c[9])+'</p>':'')+(c[10]?'<p class="n"><i>신규</i>'+esc(c[10])+'</p>':'')+'</div>');});
  return out.join('')||'<p class="msg">검색 결과가 없어요.</p>';
}
const num=x=>+String(x==null?'':x).replace(/[^\d.-]/g,'')||0,W=n=>(n<0?'-':'')+Math.abs(n).toLocaleString('ko-KR');
function finCards(rows,items,q){
